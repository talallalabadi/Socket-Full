<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="admin-page">
    <nav class="ledger-spine">
      <div class="ledger-brand">
        <div class="ledger-brand-eyebrow">Owner Dashboard</div>
        <div class="ledger-brand-name" id="side-biz-name">—</div>
      </div>
      <div class="tab active" data-panel="calendar"><span class="tab-index">01</span> Calendar</div>
      <div class="tab" data-panel="clients"><span class="tab-index">02</span> Clients</div>
      <div class="tab" data-panel="analytics"><span class="tab-index">03</span> Analytics</div>
      <div class="tab" data-panel="conversations"><span class="tab-index">04</span> AI Conversations</div>
    </nav>

    <main class="ledger-main">

      <section class="panel active" id="panel-calendar">
        <h1 class="ledger-h1">Calendar</h1>
        <p class="ledger-sub">Upcoming appointments, grouped by day.</p>
        <div id="calendar-content"></div>
      </section>

      <section class="panel" id="panel-clients">
        <h1 class="ledger-h1">Clients</h1>
        <p class="ledger-sub">Everyone who's booked, and how many times.</p>
        <div id="clients-content"></div>
      </section>

      <section class="panel" id="panel-analytics">
        <h1 class="ledger-h1">Analytics</h1>
        <p class="ledger-sub">How the booking flow is performing.</p>
        <div id="analytics-content"></div>
      </section>

      <section class="panel" id="panel-conversations">
        <h1 class="ledger-h1">AI Conversations</h1>
        <p class="ledger-sub">Live transcript of every automated booking flow.</p>
        <div id="conversations-content"></div>
      </section>

    </main>
  </div>

  <div class="toast-wrap" id="toasts"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="admin.js"></script>
</body>
</html>
